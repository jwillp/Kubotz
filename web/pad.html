<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#05080f" />
    <title>Kubotz pad</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="pad">
      <div id="stage"></div>
      <div id="bar" class="off">
        <div class="btn pill quit"><b>QUIT</b></div>
        <div class="status"><strong>Connecting</strong><span class="detail">looking for the game</span></div>
        <div class="btn pill start"><b>START</b></div>
        <button class="layouts" aria-label="Change layout"><small>Layout</small><b>Gamepad</b></button>
      </div>
    </div>
    <div id="chooser">
      <div class="box">
        <div class="head"><strong>Pick a layout</strong><button class="close">Play</button></div>
        <div class="list"></div>
        <div class="conn"></div>
      </div>
    </div>
    <div id="turn"><div><strong class="land">Turn your phone sideways</strong><strong class="port">Hold your phone upright</strong>This layout is made for it.<button class="other">Pick another layout</button></div></div>
    <script type="module" src="/src/pad/main.ts"></script>
  </body>
</html>
